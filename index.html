  <style>
    :root {
      --bg-dark: #090c10;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(48, 54, 61, 0.8);
      --accent-cyan: #00f2fe;
      --accent-purple: #7928ca;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 85% 85%, rgba(121, 40, 202, 0.05) 0%, transparent 40%);
      color: #f0f6fc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Glassmorphism Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(0, 242, 254, 0.3);
    }

    /* KPI metric styling */
    .kpi-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; }
    .kpi-val { font-size: 2.2rem; font-weight: 800; line-height: 1.1; margin: 6px 0; }
    .kpi-sub { font-size: 0.78rem; color: var(--accent-green); font-weight: 500; }

    /* Pulse dot */
    .pulse-dot {
      width: 9px; height: 9px;
      background-color: var(--accent-green);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 12px var(--accent-green);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 18px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    /* Gradient badging */
    .badge-gradient {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      color: #fff;
      font-weight: 600;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    /* Sliders */
    .form-range::-webkit-slider-thumb {
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .btn-gradient {
      background: linear-gradient(135deg, #0070f3, #7928ca);
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 10px;
      padding: 12px 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 112, 243, 0.3);
    }
